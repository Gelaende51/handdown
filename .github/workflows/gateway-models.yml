# Lists the Vercel AI Gateway's models with their prices and commits the list
# (work/bench/gateway-models.jsonl): the container cannot reach the gateway.
name: gateway-models
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run handdown gateway-models work/bench/gateway-models.jsonl
      - name: Commit the list
        run: |
          git config user.name "Vault51"
          git config user.email "Gelaende51@users.noreply.github.com"
          git add work/bench/gateway-models.jsonl
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "Gateway: model list with prices"
          git pull --rebase && git push
