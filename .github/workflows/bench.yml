# Vision benchmark: free models name the object of 500 Claude-assessed
# pictograms (docs/superpowers/specs/2026-09-30-vision-benchmark-design.md).
# Only the answers (text) are uploaded and committed to
# work/bench/results/<run id>.jsonl; hosted models (gateway:, Vercel AI
# Gateway) see the rendered pictograms, the runner's own models do not. Score locally with:
#   uv run handdown bench-score work/bench/results/*.jsonl
name: bench
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated model specs (ollama:<tag> | llamacpp:<hf repo> | gateway:<provider>/<model> | florence:omniparser), options after @: size, threads, tokens"
        default: "ollama:qwen2.5vl:3b ollama:qwen3-vl:4b-instruct ollama:gemma3:4b ollama:moondream florence:omniparser"
      limit:
        description: "Only the first N sample pictograms (speed tests); empty for all 500"
        default: ""

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' '${{ inputs.models }}')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MODEL: ${{ matrix.model }}
      LIMIT: ${{ inputs.limit }}
      # only jobs of hosted models get the key
      AI_GATEWAY_API_KEY: ${{ startsWith(matrix.model, 'gateway:') && secrets.AI_GATEWAY_API_KEY || '' }}
      NOUS_API_KEY: ${{ startsWith(matrix.model, 'nous:') && secrets.NOUS_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Model runtime
        run: |
          case "$MODEL" in
            ollama:*)
              curl -fsSL https://ollama.com/install.sh | sh
              for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
              # the install script's systemd service does not always come up: serve it ourselves
              if ! curl -sf http://127.0.0.1:11434/api/version; then
                nohup ollama serve > ollama.log 2>&1 &
                for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
              fi
              for i in 1 2 3; do
                tag="${MODEL#ollama:}"
                out=$(ollama pull "${tag%%@*}" 2>&1) && break
                echo "::warning title=ollama pull ${i}::$(echo "$out" | tail -2 | tr '\n' ' ')"
                [ "$i" = 3 ] && exit 1; sleep 20
              done ;;
            llamacpp:*)
              # pinned llama.cpp CPU build; the backend starts llama-server with capped image tokens
              curl -fsSL -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11319/llama-b11319-bin-ubuntu-x64.tar.gz
              tar xzf llama.tar.gz && echo "$PWD/llama-b11319" >> "$GITHUB_PATH" ;;
            florence:*)
              # Florence-2's remote code breaks on newer transformers
              # torchvision from the same CPU index as torch: timm would pull the CUDA build
              uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
              uv pip install "transformers==4.49.0" timm einops huggingface_hub ;;
          esac
      - if: startsWith(matrix.model, 'florence:')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omniparser-v2-florence2-base
      - run: uv run handdown import-sources work/bench/sources.jsonl
      - run: |
          for adapter in iconify npm-svg git-svg; do
            uv run handdown harvest "$adapter" --status accepted --no-registry
          done
      - run: uv run handdown bench-prepare work/bench/sample.jsonl
      - run: uv run handdown process --workers 4
      - run: uv run handdown bench-run work/bench/sample.jsonl --model "$MODEL" --out bench.jsonl ${LIMIT:+--limit "$LIMIT"}
      - if: always()
        run: uv run handdown errors --annotate
      # Only the answers leave the runner, never the pictograms
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ strategy.job-index }}
          path: bench.jsonl
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: answers
      - name: Commit the answers
        run: |
          mkdir -p work/bench/results
          cat answers/*/bench.jsonl > "work/bench/results/${{ github.run_id }}.jsonl" || true
          git config user.name "Vault51"
          git config user.email "Gelaende51@users.noreply.github.com"
          git add work/bench/results
          if git diff --cached --quiet; then echo "no answers"; exit 0; fi
          git commit -m "Bench: vision model answers (run ${{ github.run_id }})"
          git pull --rebase && git push
