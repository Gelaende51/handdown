# Long-tail labelling: a vision model names the object of every depiction
# without one (job lists from `handdown vlm-jobs`). Each runner takes a
# contiguous slice of about `per_shard` depictions, re-harvests just their
# sources and processes only those pictograms; pictograms never leave the
# runner, only the answers (text) are committed to
# work/vlm/answers/<adapter>-<run id>.jsonl. A runner stopped by the job time
# limit still uploads what it answered; the rest returns with the next
# `vlm-jobs`. Apply locally with:
#   uv run handdown vlm-apply work/vlm/answers/*.jsonl
#   uv run handdown vlm-backup            # Claude for what the model left
#   uv run handdown raster-disagreements  # colour vs black and white
name: vlm
on:
  workflow_dispatch:
    inputs:
      adapter:
        description: "Adapter: iconify | git-svg | npm-svg | font | commons"
        required: true
      model:
        description: "Model spec"
        default: "ollama:qwen3-vl:4b-instruct@threads=4"
      per_shard:
        description: "Depictions per runner (at ~55-85 s each, 250 fit the 6-hour job limit)"
        default: "250"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          n=$(python3 -c 'import math,sys; print(max(1, math.ceil(sum(1 for _ in open(sys.argv[1])) / int(sys.argv[2]))))' \
            "work/vlm/items-${{ inputs.adapter }}.jsonl" "${{ inputs.per_shard }}")
          if [ "$n" -gt 256 ]; then echo "::error::$n shards exceed the 256-job matrix limit: raise per_shard"; exit 1; fi
          echo "shards=$n" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$n")" >> "$GITHUB_OUTPUT"

  label:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Model runtime
        run: |
          case "$MODEL" in
            llamacpp:*)
              curl -fsSL -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11319/llama-b11319-bin-ubuntu-x64.tar.gz
              tar xzf llama.tar.gz && echo "$PWD/llama-b11319" >> "$GITHUB_PATH" ;;
            ollama:*)
              curl -fsSL https://ollama.com/install.sh | sh
              for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
              # the install script's systemd service does not always come up: serve it ourselves
              if ! curl -sf http://127.0.0.1:11434/api/version; then
                nohup ollama serve > ollama.log 2>&1 &
                for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
              fi
              tag="${MODEL#ollama:}"
              for i in 1 2 3; do
                out=$(ollama pull "${tag%%@*}" 2>&1) && break
                echo "::warning title=ollama pull ${i}::$(echo "$out" | tail -2 | tr '\n' ' ')"
                [ "$i" = 3 ] && exit 1; sleep 20
              done ;;
          esac
      # model weights only (no pictograms): spares Hugging Face a download per runner
      - if: startsWith(inputs.model, 'llamacpp:')
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp
          key: llamacpp-${{ inputs.model }}
      - run: |
          uv run handdown vlm-slice "work/vlm/items-${{ inputs.adapter }}.jsonl" "work/vlm/sources-${{ inputs.adapter }}.jsonl" \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.shards }}" --out-items slice-items.jsonl --out-sources slice-sources.jsonl
      - run: uv run handdown import-sources slice-sources.jsonl
      - run: uv run handdown harvest "${{ inputs.adapter }}" --status accepted --no-registry
      - run: uv run handdown bench-prepare slice-items.jsonl
      - run: uv run handdown process --workers 4
      # raster pictograms are asked twice: the original in colour and the black-and-white version
      - run: uv run handdown bench-run slice-items.jsonl --model "$MODEL" --out answers.jsonl --present-only --variants norm,original
      - if: always()
        run: uv run handdown errors --annotate
      # Only the answers leave the runner, never the pictograms
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlm-${{ matrix.shard }}
          path: answers.jsonl
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: label
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vlm-*
          path: answers
      - name: Commit the answers
        run: |
          mkdir -p work/vlm/answers
          cat answers/*/answers.jsonl > "work/vlm/answers/${{ inputs.adapter }}-${{ github.run_id }}.jsonl" || true
          git config user.name "Vault51"
          git config user.email "Gelaende51@users.noreply.github.com"
          git add work/vlm/answers
          if git diff --cached --quiet; then echo "no answers"; exit 0; fi
          git commit -m "VLM: answers for ${{ inputs.adapter }} (run ${{ github.run_id }})"
          git pull --rebase && git push
