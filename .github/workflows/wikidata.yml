# Fetch Wikidata items that carry a WordNet 3.1 synset id (P8814) with labels
# in ~25 languages, and the Wikidata items that are symbols with their English
# Wikipedia article, and commit both (Wikidata content is CC0).
# Applied locally with: uv run handdown wikidata-apply; uv run handdown link-symbols
name: wikidata
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run handdown wikidata-fetch work/wikidata/wordnet31.jsonl
      # symbols (instance or subclass of Q80071) with their English Wikipedia article, for link-symbols
      - run: uv run handdown wikidata-symbols work/wikidata/symbols.jsonl
      - name: Commit the mapping
        run: |
          git config user.name "Vault51"
          git config user.email "Gelaende51@users.noreply.github.com"
          git add work/wikidata/wordnet31.jsonl work/wikidata/symbols.jsonl
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "Wikidata: WordNet 3.1 synsets and symbols with QIDs, labels and Wikipedia articles (CC0)"
          git push
