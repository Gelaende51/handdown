# Harvest and process sources in parallel on GitHub-hosted runners.
#
# Runners can reach hosts the dev container cannot (Wikimedia Commons,
# Wikidata, ...) and have more CPU. Each shard is age-encrypted to the
# operator's public key (repository variable HANDDOWN_AGE_RECIPIENT) before
# upload, because artifacts of this public repository can be downloaded by any
# signed-in GitHub user. The private key stays on the host; merge with:
#   uv run handdown import-shard --identity ~/.config/handdown/age.key shard-*.tar.gz.age
name: harvest
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Job list (JSONL from `handdown export-sources`), e.g. work/jobs/commons.jsonl"
        required: true
      adapter:
        description: "Adapter: commons | git-svg | npm-svg | font"
        required: true
      shards:
        description: "Number of parallel runners"
        default: "8"

permissions:
  contents: read

env:
  HANDDOWN_AGE_RECIPIENT: ${{ vars.HANDDOWN_AGE_RECIPIENT }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Require the encryption key before any work
        run: |
          if [ -z "$HANDDOWN_AGE_RECIPIENT" ]; then
            echo "::error::repository variable HANDDOWN_AGE_RECIPIENT (age public key) is not set; shards must not be uploaded unencrypted"
            exit 1
          fi
      - id: m
        run: echo "matrix=$(python3 -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' '${{ inputs.shards }}')" >> "$GITHUB_OUTPUT"

  harvest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # the account runs 20 jobs at once: two bulk runs side by side leave 4 free for CI and short jobs (gateway-models, ollama-session)
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run handdown import-sources "${{ inputs.jobs }}" --shard "${{ matrix.shard }}/${{ inputs.shards }}"
      - run: uv run handdown harvest "${{ inputs.adapter }}" --status accepted --status harvested --status blocked-network --status candidate --no-registry
      - run: uv run handdown process --workers 4
      - run: uv run handdown status
      # Errors as annotations: readable through the API without job logs.
      - if: always()
        run: uv run handdown errors --annotate
      # export-shard refuses to write an unencrypted shard on Actions
      - run: uv run handdown export-shard "shard-${{ inputs.adapter }}-${{ matrix.shard }}.tar.gz"
      - name: Remove plaintext data before upload
        run: rm -rf data && ls -la shard-*
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ inputs.adapter }}-${{ matrix.shard }}
          path: shard-${{ inputs.adapter }}-${{ matrix.shard }}.tar.gz.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
