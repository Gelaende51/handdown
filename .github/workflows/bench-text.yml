# Text benchmark: Laya (Convai Innovations, Apache-2.0) picks the drawn object
# of Claude-assessed depictions from their pictogram names
# (work/bench/text.jsonl: names and WordNet candidates, metadata only).
# Answers are committed to work/bench/results/text-<run id>.jsonl; score with:
#   uv run handdown bench-text-score work/bench/text.jsonl work/bench/results/text-*.jsonl
name: bench-text
on:
  workflow_dispatch:
    inputs:
      items:
        description: "Items file (from `handdown bench-text-items`)"
        default: "work/bench/text.jsonl"

permissions:
  contents: write

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  laya:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Laya only on runners (CPU torch, not in uv.lock)
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu && uv pip install "laya==0.3.22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-laya-0.3.22
      - run: uv run handdown bench-text "${{ inputs.items }}" --out "work/bench/results/text-${{ github.run_id }}.jsonl"
      - if: always()
        run: uv run handdown errors --annotate
      - name: Commit the answers
        if: always()
        run: |
          git config user.name "Vault51"
          git config user.email "Gelaende51@users.noreply.github.com"
          git add work/bench/results
          if git diff --cached --quiet; then echo "no answers"; exit 0; fi
          git commit -m "Bench: Laya text answers (run ${{ github.run_id }})"
          git pull --rebase && git push
