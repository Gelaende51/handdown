[project]
name = "handdown"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fonttools>=4.66.0",
    "httpx>=0.28.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyrage>=1.4.0",
    "pyyaml>=6.0.3",
    "resvg-py>=0.5.0",
    "scikit-image>=0.26.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
handdown = "handdown.cli:main"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # multilingual text; typer.Option defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/handdown/site.py" = ["E501"]  # embedded CSS/JS templates
"src/handdown/review.py" = ["E501"]  # embedded HTML templates
