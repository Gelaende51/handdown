# handdown source registry.
# platforms: where pictograms are hosted; sources: individual sets/collections.
# harvest_status: candidate | accepted | rejected | blocked-network | harvested | failed
#   blocked-network = host not reachable from the dev container (proxy allowlist)
# found_via: how the entry was discovered: seed, platform:<id>, source:<id>,
#   websearch:<query-id> (see searches: below)
# adapter: git-svg (GitHub repo tarball), npm-svg (npm tarball), font, commons, api, manual

searches:
